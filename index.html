<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>袜子高度控制器 · Sock Height Controller</title>
<style>
  :root {
    --cream: #fcf7f4;
    --ink: #1a1a1a;
    --accent: #e8b04b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #efe7db;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .frame {
    position: relative;
    width: min(1200px, 100%);
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 28px;
    padding: 24px 36px 20px;
    overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,.12);
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 34px; height: 34px;
    border: 4px solid var(--ink);
    border-radius: 50%;
    opacity: .15;
  }
  .frame::before { top: -14px; left: -14px; }
  .frame::after  { bottom: -14px; right: -14px; }

  header { text-align: center; position: relative; z-index: 2; }
  header h1 {
    font-size: clamp(20px, 3.2vw, 30px);
    letter-spacing: .12em;
  }
  header p.sub {
    margin-top: 4px;
    font-size: 13px;
    color: #8a8378;
    letter-spacing: .25em;
    text-transform: uppercase;
  }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vw, 70px);
    margin-top: 4px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }

  .character { flex: 0 0 auto; }
  .character svg { display: block; height: min(64vh, 580px); width: auto; }

  .panel {
    flex: 0 1 460px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .readout { text-align: center; }
  .readout .zone {
    font-size: clamp(30px, 4.5vw, 44px);
    font-weight: 700;
    letter-spacing: .1em;
  }
  .readout .pct {
    margin-top: 2px;
    font-size: 14px;
    color: #9a917f;
    font-variant-numeric: tabular-nums;
    letter-spacing: .1em;
  }
  .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: #ffd9e0;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .2em;
    opacity: 0;
    transform: scale(.7);
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .badge.on { opacity: 1; transform: scale(1); }

  /* ------- chunky slider, styled after the reference ------- */
  .slider-wrap { padding: 6px 4px; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 48px;
    background: transparent;
    cursor: pointer;
    display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 24px;
    background: #c7c3bd;
    border: 4px solid var(--ink);
    border-radius: 999px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 46px; height: 46px;
    margin-top: -15px;
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .1s;
  }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.12); }
  input[type="range"]::-moz-range-track {
    height: 24px;
    background: #c7c3bd;
    border: 4px solid var(--ink);
    border-radius: 999px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 38px; height: 38px;
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
  }

  .ticks {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #a39a88;
    padding: 0 10px;
    letter-spacing: .05em;
  }
  .ticks span.active { color: var(--ink); font-weight: 700; }

  .colors {
    display: flex;
    justify-content: center;
    gap: 14px;
    align-items: center;
  }
  .colors .label { font-size: 13px; color: #8a8378; letter-spacing: .2em; }
  .swatch {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    cursor: pointer;
    transition: transform .15s;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
  .swatch.striped {
    background: repeating-linear-gradient(0deg, #b9a6e8 0 5px, #fff 5px 10px);
  }

  footer {
    text-align: center;
    margin-top: 12px;
    position: relative;
    z-index: 2;
  }
  footer .caption {
    display: inline-block;
    font-size: clamp(15px, 2.4vw, 22px);
    font-weight: 700;
    letter-spacing: .15em;
    color: #fff;
    background: rgba(0,0,0,.75);
    padding: 6px 18px;
    border-radius: 8px;
  }

  /* ------- floating background doodles ------- */
  .doodle {
    position: absolute;
    z-index: 1;
    opacity: .8;
    animation: bob 4s ease-in-out infinite;
    pointer-events: none;
  }
  .doodle svg { display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-10px) rotate(var(--r, 0deg)); }
  }
  .sparkle {
    position: absolute;
    z-index: 1;
    font-weight: 700;
    animation: twinkle 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.8); }
    50% { opacity: .9; transform: scale(1.15); }
  }

  @media (max-width: 760px) {
    .character svg { height: 46vh; }
    .frame { padding: 20px 16px; }
  }
</style>
</head>

    <div class="panel">
      <div class="readout">
        <div class="zone" id="zoneName">连裤袜</div>
        <div class="pct" id="pct">100%</div>
        <div class="badge" id="zettai">✦ 绝对领域 ✦</div>
      </div>

      <div class="slider-wrap">
        <input type="range" id="height" min="0" max="100" value="100" step="1"
               aria-label="袜子高度">
      </div>
      <div class="ticks" id="ticks">
        <span data-zone="光腿">光腿</span>
        <span data-zone="船袜">船袜</span>
        <span data-zone="短袜">短袜</span>
        <span data-zone="中筒袜">中筒</span>
        <span data-zone="及膝袜">及膝</span>
        <span data-zone="过膝袜">过膝</span>
        <span data-zone="大腿袜">大腿</span>
        <span data-zone="连裤袜">裤袜</span>
      </div>

      <div class="colors">
        <span class="label">颜色</span>
        <button class="swatch sel" data-color="black" style="background:#2a2a2e" aria-label="黑色"></button>
        <button class="swatch" data-color="#f2f0ea" style="background:#f5f5f0" aria-label="白色"></button>
        <button class="swatch" data-color="#4a5878" style="background:#39435f" aria-label="藏青"></button>
        <button class="swatch" data-color="#f6c9cf" style="background:#f6c9cf" aria-label="粉色"></button>
        <button class="swatch striped" data-color="url(#sockStripes)" aria-label="条纹"></button>
      </div>
    </div>
  </div>

  <footer>
    <span class="caption">它就像美少女下半身的滑动变阻器</span>
  </footer>
</div>

<script>
(() => {
  const slider    = document.getElementById('height');
  const skinL     = document.getElementById('skinFillL');
  const skinR     = document.getElementById('skinFillR');
  const colorFill = document.getElementById('colorFill');
  const sockBand  = document.getElementById('sockBand');
  const kneeL     = document.getElementById('kneeL');
  const kneeR     = document.getElementById('kneeR');
  const zoneEl    = document.getElementById('zoneName');
  const pctEl     = document.getElementById('pct');
  const badge     = document.getElementById('zettai');
  const ticks     = document.querySelectorAll('#ticks span');
  const swatches  = document.querySelectorAll('.swatch');

  // artwork geometry (svg user units)
  const HIP_Y   = 600;   // top of the legs, hidden under the skirt shadow
  const ANKLE_Y = 905;   // sock top at 0%, just above the loafers
  const LEG_BOT = 935;   // bottom edge of the artwork

  let sockColor = 'black';   // 'black' = the artwork's own tights

  const ZONES = [
    [ 2,  '光腿'],
    [ 8,  '船袜'],
    [25,  '短袜'],
    [48,  '中筒袜'],
    [64,  '及膝袜'],
    [82,  '过膝袜'],
    [93,  '大腿袜'],
    [101, '连裤袜'],
  ];
  const zoneOf = v => ZONES.find(([max]) => v < max)[1];

  function render() {
    const v = +slider.value;
    const zone = zoneOf(v);
    const isTights = zone === '连裤袜';
    const isBare   = zone === '光腿';
    const topY = isBare ? LEG_BOT : ANKLE_Y - (v / 100) * (ANKLE_Y - HIP_Y);

    // skin: from under the skirt down to the sock top
    const skinH = isTights ? 0 : Math.max(0, topY - HIP_Y);
    skinL.setAttribute('height', skinH);
    skinR.setAttribute('height', skinH);

    // colored sock over the remaining tights
    if (sockColor === 'black' || isBare) {
      colorFill.setAttribute('height', 0);
    } else {
      const cTop = isTights ? HIP_Y : topY;
      colorFill.setAttribute('y', cTop);
      colorFill.setAttribute('height', LEG_BOT - cTop);
      colorFill.setAttribute('fill', sockColor);
    }

    // welt band at the sock top
    if (isBare || isTights) {
      sockBand.setAttribute('opacity', 0);
    } else {
      sockBand.setAttribute('y', topY);
      sockBand.setAttribute('opacity', 0.3);
    }

    // knees show once bare
    const kneesBare = !isTights && topY > 750;
    kneeL.setAttribute('stroke-width', kneesBare ? 2 : 0);
    kneeR.setAttribute('stroke-width', kneesBare ? 2 : 0);

    zoneEl.textContent = zone;
    pctEl.textContent = v + '%';
    ticks.forEach(t => t.classList.toggle('active', t.dataset.zone === zone));

    badge.classList.toggle('on', zone === '过膝袜' || zone === '大腿袜');
  }

  slider.addEventListener('input', render);

  swatches.forEach(s => s.addEventListener('click', () => {
    swatches.forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
    sockColor = s.dataset.color;
    render();
  }));

  render();
})();
</script>
</body>
</html>
