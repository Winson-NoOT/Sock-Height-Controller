<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>袜子高度控制器 · Sock Height Controller</title>
<style>
  :root {
    --cream: #fcf7f4;
    --ink: #1a1a1a;
    --accent: #e8b04b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #efe7db;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
  }
  .frame {
    position: relative;
    width: min(1200px, 100%);
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 28px;
    padding: 24px 36px 20px;
    overflow: hidden;
    box-shadow: 0 10px 0 rgba(0,0,0,.12);
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 34px; height: 34px;
    border: 4px solid var(--ink);
    border-radius: 50%;
    opacity: .15;
  }
  .frame::before { top: -14px; left: -14px; }
  .frame::after  { bottom: -14px; right: -14px; }

  header { text-align: center; position: relative; z-index: 2; }
  header h1 {
    font-size: clamp(20px, 3.2vw, 30px);
    letter-spacing: .12em;
  }
  header p.sub {
    margin-top: 4px;
    font-size: 13px;
    color: #8a8378;
    letter-spacing: .25em;
    text-transform: uppercase;
  }

  .stage {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(16px, 4vw, 70px);
    margin-top: 4px;
    position: relative;
    z-index: 2;
    flex-wrap: wrap;
  }

  .character { flex: 0 0 auto; }
  .character svg { display: block; height: min(64vh, 580px); width: auto; }

  .panel {
    flex: 0 1 460px;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .readout { text-align: center; }
  .readout .zone {
    font-size: clamp(30px, 4.5vw, 44px);
    font-weight: 700;
    letter-spacing: .1em;
  }
  .readout .pct {
    margin-top: 2px;
    font-size: 14px;
    color: #9a917f;
    font-variant-numeric: tabular-nums;
    letter-spacing: .1em;
  }
  .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 4px 14px;
    border: 3px solid var(--ink);
    border-radius: 999px;
    background: #ffd9e0;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: .2em;
    opacity: 0;
    transform: scale(.7);
    transition: all .25s cubic-bezier(.34,1.56,.64,1);
  }
  .badge.on { opacity: 1; transform: scale(1); }

  /* ------- chunky slider, styled after the reference ------- */
  .slider-wrap { padding: 6px 4px; }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 48px;
    background: transparent;
    cursor: pointer;
    display: block;
  }
  input[type="range"]::-webkit-slider-runnable-track {
    height: 24px;
    background: #c7c3bd;
    border: 4px solid var(--ink);
    border-radius: 999px;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 46px; height: 46px;
    margin-top: -15px;
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
    transition: transform .1s;
  }
  input[type="range"]:active::-webkit-slider-thumb { transform: scale(1.12); }
  input[type="range"]::-moz-range-track {
    height: 24px;
    background: #c7c3bd;
    border: 4px solid var(--ink);
    border-radius: 999px;
  }
  input[type="range"]::-moz-range-thumb {
    width: 38px; height: 38px;
    background: #fff;
    border: 5px solid var(--ink);
    border-radius: 50%;
    box-shadow: 0 3px 0 rgba(0,0,0,.2);
  }

  .ticks {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #a39a88;
    padding: 0 10px;
    letter-spacing: .05em;
  }
  .ticks span.active { color: var(--ink); font-weight: 700; }

  .colors {
    display: flex;
    justify-content: center;
    gap: 14px;
    align-items: center;
  }
  .colors .label { font-size: 13px; color: #8a8378; letter-spacing: .2em; }
  .swatch {
    width: 34px; height: 34px;
    border-radius: 50%;
    border: 3px solid var(--ink);
    cursor: pointer;
    transition: transform .15s;
    padding: 0;
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.sel { outline: 3px solid var(--accent); outline-offset: 3px; }
  .swatch.striped {
    background: repeating-linear-gradient(0deg, #b9a6e8 0 5px, #fff 5px 10px);
  }

  footer {
    text-align: center;
    margin-top: 12px;
    position: relative;
    z-index: 2;
  }
  footer .caption {
    display: inline-block;
    font-size: clamp(15px, 2.4vw, 22px);
    font-weight: 700;
    letter-spacing: .15em;
    color: #fff;
    background: rgba(0,0,0,.75);
    padding: 6px 18px;
    border-radius: 8px;
  }

  /* ------- floating background doodles ------- */
  .doodle {
    position: absolute;
    z-index: 1;
    opacity: .8;
    animation: bob 4s ease-in-out infinite;
    pointer-events: none;
  }
  .doodle svg { display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-10px) rotate(var(--r, 0deg)); }
  }
  .sparkle {
    position: absolute;
    z-index: 1;
    font-weight: 700;
    animation: twinkle 2.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .25; transform: scale(.8); }
    50% { opacity: .9; transform: scale(1.15); }
  }

  @media (max-width: 760px) {
    .character svg { height: 46vh; }
    .frame { padding: 20px 16px; }
  }
</style>
</head>
<body>
<div class="frame">

  <!-- background doodles -->
  <div class="doodle" style="top:12%; left:3%; --r:-15deg;">
    <svg width="72" height="86" viewBox="0 0 60 72"><path d="M18 6h24v26c0 10 6 12 6 22a16 16 0 0 1-32 0c0-6 2-9 2-14z" fill="#dcdcdc" stroke="#b5b5b5" stroke-width="3" stroke-linejoin="round"/><path d="M18 6h24v10H18z" fill="#fff" stroke="#b5b5b5" stroke-width="3"/></svg>
  </div>
  <div class="doodle" style="top:30%; right:3%; --r:14deg; animation-delay:.8s;">
    <svg width="72" height="86" viewBox="0 0 60 72"><path d="M18 6h24v26c0 10 6 12 6 22a16 16 0 0 1-32 0c0-6 2-9 2-14z" fill="#f6c9cf" stroke="#e39aa5" stroke-width="3" stroke-linejoin="round"/><path d="M18 6h24v10H18z" fill="#fbe4e7" stroke="#e39aa5" stroke-width="3"/><path d="M26 12c2-3 8-3 8 0" fill="none" stroke="#e39aa5" stroke-width="2.5" stroke-linecap="round"/></svg>
  </div>
  <div class="doodle" style="bottom:14%; left:4%; --r:10deg; animation-delay:1.4s;">
    <svg width="78" height="92" viewBox="0 0 60 72"><path d="M18 6h24v26c0 10 6 12 6 22a16 16 0 0 1-32 0c0-6 2-9 2-14z" fill="#eef6fc" stroke="#a9cfe8" stroke-width="3" stroke-linejoin="round"/><path d="M18 6h24v10H18z" fill="#fff" stroke="#a9cfe8" stroke-width="3"/><circle cx="26" cy="34" r="2.4" fill="#a9cfe8"/><circle cx="36" cy="44" r="2.4" fill="#a9cfe8"/><circle cx="28" cy="54" r="2.4" fill="#a9cfe8"/></svg>
  </div>
  <div class="doodle" style="bottom:8%; right:4%; --r:-12deg; animation-delay:.4s;">
    <svg width="80" height="94" viewBox="0 0 60 72"><path d="M18 6h24v26c0 10 6 12 6 22a16 16 0 0 1-32 0c0-6 2-9 2-14z" fill="#cbb7ee" stroke="#a58bd8" stroke-width="3" stroke-linejoin="round"/><path d="M20 30l22-8M20 40l24-9M22 52l24-10M28 64l18-8" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M18 6h24v10H18z" fill="#e8def8" stroke="#a58bd8" stroke-width="3"/></svg>
  </div>
  <div class="sparkle" style="top:18%; left:16%; color:#f0b429; font-size:26px;">✦</div>
  <div class="sparkle" style="top:55%; left:7%;  color:#5fca8e; font-size:18px; animation-delay:1s;">✦</div>
  <div class="sparkle" style="top:12%; right:14%; color:#f0b429; font-size:20px; animation-delay:.5s;">✦</div>
  <div class="sparkle" style="bottom:20%; right:16%; color:#f28cb1; font-size:24px; animation-delay:1.6s;">✦</div>
  <div class="sparkle" style="bottom:9%;  left:32%; color:#f0b429; font-size:22px; animation-delay:2s;">✦</div>

  <header>
    <h1>袜 子 高 度 控 制 器</h1>
    <p class="sub">Sock Height Controller</p>
  </header>

  <div class="stage">
    <div class="character">
      <!-- character: original artwork + overlays that repaint the tights -->
      <svg viewBox="0 0 370 1000" xmlns="http://www.w3.org/2000/svg" aria-label="穿校服的动漫少女">
        <defs>
          <!-- leg silhouettes traced from the artwork, inset 2px so line art survives -->
          <clipPath id="legsClip">
            <path d="M89,600 L150,600 L150,608 L149,616 L148,624 L148,632 L147,640 L147,648 L147,656 L147,664 L147,672 L147,680 L147,688 L147,696 L146,704 L145,712 L144,720 L143,728 L143,736 L144,744 L145,752 L146,760 L147,768 L148,776 L148,784 L148,792 L148,800 L148,808 L148,816 L148,824 L148,832 L148,840 L148,848 L147,856 L147,864 L147,872 L148,880 L148,888 L148,896 L149,904 L150,912 L151,920 L153,928 L128,928 L129,920 L128,912 L127,904 L126,896 L125,888 L123,880 L122,872 L120,864 L118,856 L116,848 L115,840 L113,832 L111,824 L109,816 L107,808 L105,800 L104,792 L103,784 L102,776 L101,768 L101,760 L102,752 L102,744 L103,736 L104,728 L104,720 L105,712 L105,704 L105,696 L105,688 L104,680 L104,672 L102,664 L101,656 L99,648 L98,640 L96,632 L94,624 L93,616 L91,608 L89,600 Z"/>
            <path d="M182,600 L247,600 L246,608 L245,616 L245,624 L244,632 L244,640 L244,648 L244,656 L244,664 L245,672 L246,680 L248,688 L251,696 L255,704 L259,712 L263,720 L266,728 L269,736 L272,744 L274,752 L276,760 L277,768 L278,776 L279,784 L279,792 L280,800 L280,808 L281,816 L281,824 L281,832 L282,840 L282,848 L282,856 L283,864 L284,872 L284,880 L285,888 L287,896 L289,904 L292,912 L295,920 L300,928 L266,928 L265,920 L264,912 L264,904 L264,896 L263,888 L261,880 L260,872 L258,864 L257,856 L255,848 L253,840 L251,832 L248,824 L246,816 L243,808 L241,800 L238,792 L235,784 L232,776 L230,768 L227,760 L225,752 L223,744 L220,736 L218,728 L215,720 L212,712 L208,704 L204,696 L201,688 L200,680 L198,672 L197,664 L195,656 L194,648 L192,640 L190,632 L188,624 L186,616 L184,608 L182,600 Z"/>
            <!-- upper-thigh regions: top edge follows the skirt hem -->
            <path d="M89,604 L89,556 L93,554 L97,556 L101,560 L105,560 L109,562 L113,563 L117,565 L121,565 L125,562 L129,560 L133,566 L137,566 L141,568 L145,568 L149,570 L150,570 L150,604 Z"/>
            <path d="M182,604 L182,572 L186,572 L190,572 L194,572 L198,570 L202,564 L206,570 L210,570 L214,570 L218,570 L222,569 L226,570 L230,570 L234,568 L238,562 L242,562 L246,564 L247,564 L247,604 Z"/>
          </clipPath>
          <pattern id="sockStripes" width="16" height="16" patternUnits="userSpaceOnUse">
            <rect width="16" height="16" fill="#ffffff"/>
            <rect width="16" height="8" fill="#b9a6e8"/>
          </pattern>
          <linearGradient id="skinL" x1="87" y1="0" x2="155" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0"   stop-color="#eec5a5"/>
            <stop offset=".25" stop-color="#ffe6cd"/>
            <stop offset=".75" stop-color="#ffe6cd"/>
            <stop offset="1"   stop-color="#e9bd9c"/>
          </linearGradient>
          <linearGradient id="skinR" x1="180" y1="0" x2="302" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0"   stop-color="#eec5a5"/>
            <stop offset=".25" stop-color="#ffe6cd"/>
            <stop offset=".75" stop-color="#ffe6cd"/>
            <stop offset="1"   stop-color="#e9bd9c"/>
          </linearGradient>
        </defs>

        <!-- ground shadow -->
        <ellipse cx="210" cy="972" rx="125" ry="15" fill="#e3d9cc"/>

        <!-- the original character -->
        <image href="char.webp" x="0" y="0" width="370" height="935"/>

        <!-- erase the artwork's own feet (cut by the caption band) so the
             redrawn loafers below are the only feet -->
        <rect x="78" y="893" width="257" height="47" fill="#fcf7f4"/>

        <g clip-path="url(#legsClip)">
          <!-- bare skin, painted over the tights down to the sock top -->
          <rect id="skinFillL" x="85"  y="536" width="72"  height="0" fill="url(#skinL)"/>
          <rect id="skinFillR" x="178" y="536" width="126" height="0" fill="url(#skinR)"/>
          <!-- colored socks keep the artwork's shading via screen blending -->
          <rect id="colorFill" x="85" y="935" width="220" height="0" style="mix-blend-mode:screen"/>
          <!-- welt band at the sock top -->
          <rect id="sockBand" x="85" y="935" width="220" height="8" fill="#000" opacity="0"/>
        </g>

        <!-- knee hints, visible only when the knees are bare -->
        <path id="kneeL" d="M116,724 q7,5 14,0" stroke="#e5b896" stroke-width="0" fill="none"/>
        <path id="kneeR" d="M228,742 q8,5 16,1" stroke="#e5b896" stroke-width="0" fill="none"/>

        <!-- redrawn loafers, seated under the actual ankles (the caption in
             the source frame covered the originals) -->
        <g stroke="#3f2c1d" stroke-width="3" stroke-linejoin="round">
          <path d="M125,886 C123,911 116,925 104,936 C96,943 98,953 110,955 L150,955 C159,955 162,948 161,938 L154,886 Z" fill="#6a4630"/>
          <path d="M104,936 C116,938 141,938 156,933" fill="none" stroke-width="2.5" opacity=".7"/>
          <path d="M292,886 C293,911 300,927 314,939 C323,946 321,956 309,958 L269,958 C260,958 257,950 258,940 L261,886 Z" fill="#6a4630"/>
          <path d="M314,939 C302,941 277,941 262,936" fill="none" stroke-width="2.5" opacity=".7"/>
        </g>
        <path d="M100,953 L160,953 L160,960 C160,964 157,966 152,966 L108,966 C101,966 99,961 100,953 Z" fill="#37261a"/>
        <path d="M319,956 L260,956 L260,963 C260,967 263,969 268,969 L311,969 C318,969 320,964 319,956 Z" fill="#37261a"/>
      </svg>
    </div>

    <div class="panel">
      <div class="readout">
        <div class="zone" id="zoneName">连裤袜</div>
        <div class="pct" id="pct">100%</div>
        <div class="badge" id="zettai">✦ 绝对领域 ✦</div>
      </div>

      <div class="slider-wrap">
        <input type="range" id="height" min="0" max="100" value="100" step="1"
               aria-label="袜子高度">
      </div>
      <div class="ticks" id="ticks">
        <span data-zone="光腿">光腿</span>
        <span data-zone="船袜">船袜</span>
        <span data-zone="短袜">短袜</span>
        <span data-zone="中筒袜">中筒</span>
        <span data-zone="及膝袜">及膝</span>
        <span data-zone="过膝袜">过膝</span>
        <span data-zone="大腿袜">大腿</span>
        <span data-zone="连裤袜">裤袜</span>
      </div>

      <div class="colors">
        <span class="label">颜色</span>
        <button class="swatch sel" data-color="black" style="background:#2a2a2e" aria-label="黑色"></button>
        <button class="swatch" data-color="#f2f0ea" style="background:#f5f5f0" aria-label="白色"></button>
        <button class="swatch" data-color="#4a5878" style="background:#39435f" aria-label="藏青"></button>
        <button class="swatch" data-color="#f6c9cf" style="background:#f6c9cf" aria-label="粉色"></button>
        <button class="swatch striped" data-color="url(#sockStripes)" aria-label="条纹"></button>
      </div>
    </div>
  </div>

  <footer>
    <span class="caption">它就像美少女下半身的滑动变阻器</span>
  </footer>
</div>

<script>
(() => {
  const slider    = document.getElementById('height');
  const skinL     = document.getElementById('skinFillL');
  const skinR     = document.getElementById('skinFillR');
  const colorFill = document.getElementById('colorFill');
  const sockBand  = document.getElementById('sockBand');
  const kneeL     = document.getElementById('kneeL');
  const kneeR     = document.getElementById('kneeR');
  const zoneEl    = document.getElementById('zoneName');
  const pctEl     = document.getElementById('pct');
  const badge     = document.getElementById('zettai');
  const ticks     = document.querySelectorAll('#ticks span');
  const swatches  = document.querySelectorAll('.swatch');

  // artwork geometry (svg user units)
  const LEG_TOP = 536;   // above the skirt hem; the clip path trims to the hem line
  const HIP_Y   = 600;   // sock top at max non-tights height
  const ANKLE_Y = 878;   // sock top at 0%, just above the loafers
  const LEG_BOT = 893;   // legs end here; the redrawn loafers take over

  let sockColor = 'black';   // 'black' = the artwork's own tights

  const ZONES = [
    [ 2,  '光腿'],
    [ 8,  '船袜'],
    [25,  '短袜'],
    [48,  '中筒袜'],
    [64,  '及膝袜'],
    [82,  '过膝袜'],
    [93,  '大腿袜'],
    [101, '连裤袜'],
  ];
  const zoneOf = v => ZONES.find(([max]) => v < max)[1];

  function render() {
    const v = +slider.value;
    const zone = zoneOf(v);
    const isTights = zone === '连裤袜';
    const isBare   = zone === '光腿';
    const topY = isBare ? LEG_BOT : ANKLE_Y - (v / 100) * (ANKLE_Y - HIP_Y);

    // skin: from under the skirt down to the sock top
    const skinH = isTights ? 0 : Math.max(0, topY - LEG_TOP);
    skinL.setAttribute('height', skinH);
    skinR.setAttribute('height', skinH);

    // colored sock over the remaining tights
    if (sockColor === 'black' || isBare) {
      colorFill.setAttribute('height', 0);
    } else {
      const cTop = isTights ? LEG_TOP : topY;
      colorFill.setAttribute('y', cTop);
      colorFill.setAttribute('height', LEG_BOT - cTop);
      colorFill.setAttribute('fill', sockColor);
    }

    // welt band at the sock top
    if (isBare || isTights) {
      sockBand.setAttribute('opacity', 0);
    } else {
      sockBand.setAttribute('y', topY);
      sockBand.setAttribute('opacity', 0.3);
    }

    // knees show once bare
    const kneesBare = !isTights && topY > 750;
    kneeL.setAttribute('stroke-width', kneesBare ? 2 : 0);
    kneeR.setAttribute('stroke-width', kneesBare ? 2 : 0);

    zoneEl.textContent = zone;
    pctEl.textContent = v + '%';
    ticks.forEach(t => t.classList.toggle('active', t.dataset.zone === zone));

    badge.classList.toggle('on', zone === '过膝袜' || zone === '大腿袜');
  }

  slider.addEventListener('input', render);

  swatches.forEach(s => s.addEventListener('click', () => {
    swatches.forEach(x => x.classList.remove('sel'));
    s.classList.add('sel');
    sockColor = s.dataset.color;
    render();
  }));

  render();
})();
</script>
</body>
</html>
